# Releases on a pushed v* tag: runs every check, packs the tarball and
# opens a draft GitHub release with it, its SHA-256 and the version's notes
# from CHANGELOG.md. It never publishes to npm: that is manual
# (RELEASING.md). Run it by hand (workflow_dispatch) for a dry run, which
# uploads what it would release as an artifact and creates nothing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    secrets:
      ACTLET_READ_TOKEN: ${{ secrets.ACTLET_READ_TOKEN }}
      ACTLET_DEPLOY_KEY: ${{ secrets.ACTLET_DEPLOY_KEY }}

  release:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # To create the draft release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pack, and take the notes from CHANGELOG.md
        id: prepare
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            node scripts/release.mjs --tag "$TAG"
          else
            node scripts/release.mjs
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

      - name: Create the draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.prepare.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --title "$TAG" --notes-file release/notes.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" --repo "$GITHUB_REPOSITORY" release/*.tgz release/*.sha256
